name: Supabase 免费版保活
on:
  schedule:
    - cron: "0 0 */3 * *"  # 每3天执行一次
  workflow_dispatch:       # 允许手动点一下测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: 访问Supabase保活
        run: |
          curl -X POST ${{ secrets.SUPABASE_URL }}/rest/v1/ \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
