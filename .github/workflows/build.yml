name: 构建 WebView APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 用公共可访问的模板，不会报错
      - name: 下载安卓打包模板
        run: |
          git clone https://github.com/vaquitaaa/WebViewApp.git temp-apk
          cp -r ./* temp-apk/app/src/main/assets/
          cd temp-apk
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 文件
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: temp-apk/app/build/outputs/apk/release/*.apk
