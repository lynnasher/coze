name: 打包 ti100 刷题网页 APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK & Android 环境
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 生成完整 Android WebView 项目
        run: |
          mkdir -p android/app/src/main/{java/com/ti100,res/layout}
          
          # MainActivity 硬编码你的网址
          cat > android/app/src/main/java/com/ti100/MainActivity.java <<'EOF'
package com.ti100;
import android.os.Bundle;
import android.webkit.WebChromeClient;
import android.webkit.WebSettings;
import android.webkit.WebView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        WebView webView = findViewById(R.id.webview);
        WebSettings ws = webView.getSettings();
        ws.setJavaScriptEnabled(true);
        ws.setDomStorageEnabled(true);
        ws.setAllowFileAccess(true);
        webView.setWebChromeClient(new WebChromeClient());
        webView.loadUrl("https://ti100.coze.site/");
    }
}
EOF

          # 布局：全屏铺满
          cat > android/app/src/main/res/layout/activity_main.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<WebView
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:id="@+id/webview"
    android:layout_width="match_parent"
    android:layout_height="match_parent"/>
EOF

          # build.gradle
          cat > android/app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}
android {
    namespace "com.ti100"
    compileSdk 34
    defaultConfig {
        applicationId "com.ti100.app"
        minSdk 21
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
EOF

          cat > android/settings.gradle <<'EOF'
include ':app'
EOF

      - name: 构建 Release APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --stacktrace

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: ti100-刷题APP
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
