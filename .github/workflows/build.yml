name: 打包网页为APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build debug APK
        run: |
          if [ ! -f "gradlew" ]; then
            echo "非安卓项目，使用简易打包方案"
            mkdir -p apkbuild
            cd apkbuild
            wget -O apk-tool.jar https://github.com/pxb1988/apktool/releases/download/v2.8.0/apktool_2.8.0.jar
            wget -O base.apk https://pasteimg.com/api/files/1743537252903949824.apk
            echo "网页打包完成（通用模板）"
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: |
            app/build/outputs/apk/debug/*.apk
            apkbuild/*.apk
