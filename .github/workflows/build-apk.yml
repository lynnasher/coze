name: TI100打包
on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: sudo apt update && sudo apt install -y curl unzip

      - name: 网页转APK
        run: |
          curl -Ls https://github.com/kiibk/web2apk-linux/releases/download/v1.0/web2apk-linux -o web2apk
          chmod +x web2apk
          ./web2apk --url https://ti100.coze.site --name TI100刷题

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: TI100-App
          path: app.apk
