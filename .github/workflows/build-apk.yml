name: 智能刷题 APK

on:
  push:
    branches:
      - main  # 仅在推送到 main 分支时触发
  workflow_dispatch:  # 允许手动触发
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Execution Permissions
        run: |
          chmod +x web2apk  # 确保脚本可执行
          ls -l web2apk      # 验证权限

      - name: Run Web2APK Script
        run: |
          ./web2apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: generated-apk
          path: |
            *.apk
            !node_modules/**/*.apk
