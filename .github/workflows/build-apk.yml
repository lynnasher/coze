name: TI100 刷题 APP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 直接屏蔽Node.js警告
    steps:
      - name: 安装基础工具
        run: sudo apt update && sudo apt install -y wget unzip

      - name: 一键生成网页APK
        run: |
          wget -q https://github.com/haxbinz/web2apk/releases/download/v1.0/web2apk
          chmod +x web2apk
          ./web2apk --url="https://ti100.coze.site/" --name="TI100刷题" --package="com.ti100.app"

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: ti100-final
          path: output.apk
