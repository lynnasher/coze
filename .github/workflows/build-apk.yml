name: TI100 刷题 APK 打包
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Android SDK 环境
        run: |
          sudo apt update
          sudo apt install -y android-sdk

      - name: 生成极简 WebView 项目
        run: |
          # 创建项目结构
          mkdir -p app/src/main/java/com/ti100
          mkdir -p app/src/main/res/layout
          
          # 生成代码
          cat > app/src/main/java/com/ti100/MainActivity.kt << EOF
          package com.ti100
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val web = findViewById<WebView>(R.id.webview)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.loadUrl("https://ti100.coze.site/")
              }
          }
          EOF

          cat > app/src/main/res/layout/activity_main.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <WebView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/webview"
              android:layout_width="match_parent"
              android:layout_height="match_parent"/>
          EOF

          cat > app/build.gradle << EOF
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          android {
              namespace "com.ti100"
              compileSdk 34
              defaultConfig {
                  applicationId "com.ti100.app"
                  minSdk 21
                  targetSdk 34
              }
          }
          EOF

      - name: 打包 APK
        run: |
          echo "include ':app'" > settings.gradle
          curl -sSL https://get.gradle.org | bash
          gradle wrapper
          ./gradlew assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ti100-apk
          path: app/build/outputs/apk/release/*.apk
