name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'main'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Execution Permissions
        run: |
          chmod +x web2apk
          ls -l web2apk

      - name: Run Web2APK Script
        run: |
          ./web2apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4  # 关键：使用v4版本替代v3
        with:
          name: generated-apk
          path: |
            *.apk
            !node_modules/**/*.apk
