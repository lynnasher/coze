name: 打包TI100刷题APP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 生成WebView APK
        uses: lzh325/webview-action@v1.0.0
        with:
          url: "https://ti100.coze.site/"
          app_name: "TI100刷题"
          package_name: "com.ti100.app"
          
      - name: 下载APK
        uses: actions/upload-artifact@v4
        with:
          name: ti100-final-apk
          path: "*.apk"
